<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BUNDLE_HASH'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>D2 diagram</title>
  <style>
    :root { color-scheme:light; --bg:#fff; --fg:#0A0F25; --muted:#676C7E; --line:#CFD2DD; --subtle:#F7F8FE; --accent:#0D32B2; font:14px/1.5 system-ui,sans-serif; }
    :root[data-theme=dark] { color-scheme:dark; --bg:#0A0F25; --fg:#EEF1F8; --muted:#9499AB; --line:#676C7E; --subtle:#171c32; --accent:#CFD2DD; }
    * { box-sizing:border-box; } body { margin:0; color:var(--fg); background:var(--bg); }
    header { padding:10px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:14px; font-weight:600; } #connection { margin-right:auto; color:var(--muted); font-size:12px; }
    button { font:inherit; font-size:12px; border:1px solid var(--line); color:var(--fg); background:var(--bg); border-radius:4px; padding:5px 9px; cursor:pointer; }
    button:disabled { opacity:.45; cursor:default; } button:focus-visible,summary:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .view-controls { display:flex; gap:4px; } .view-controls button { min-width:30px; }
    .preview { position:relative; height:440px; overflow:hidden; background:var(--subtle); }
    #viewport { position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab; }
    #viewport:active { cursor:grabbing; } #diagram { position:absolute; top:50%; left:50%; transform-origin:center; max-width:none; pointer-events:none; user-select:none; }
    #ascii { margin:0; position:absolute; inset:0; overflow:auto; padding:20px; font:12px/1.35 ui-monospace,monospace; white-space:pre; }
    #empty { position:absolute; inset:0; display:grid; place-content:center; padding:24px; text-align:center; color:var(--muted); pointer-events:none; }
    [hidden] { display:none !important; }
    #source-panel { border-top:1px solid var(--line); } summary { padding:8px 14px; cursor:pointer; color:var(--muted); font-size:12px; }
    textarea { display:block; width:100%; height:160px; resize:vertical; border:0; border-top:1px solid var(--line); padding:12px 14px; background:var(--bg); color:var(--fg); font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; tab-size:2; }
    #status { margin:0; border-top:1px solid var(--line); padding:8px 14px; font-size:12px; color:var(--muted); overflow-wrap:anywhere; white-space:pre-wrap; } #status[data-error=true] { color:#c23d43; }
    @media(max-width:480px) { .preview { height:340px; } }
  </style>
</head>
<body>
  <header>
    <h1>D2 diagram</h1><span id="connection">Connecting…</span>
    <div class="view-controls" aria-label="Preview controls"><button id="zoom-out" aria-label="Zoom out" disabled>−</button><button id="fit" disabled>Fit</button><button id="zoom-in" aria-label="Zoom in" disabled>+</button></div>
    <button id="copy-source" disabled>Copy D2</button><button id="download-image" disabled hidden>Download PNG</button>
  </header>
  <main>
    <section class="preview" aria-label="Diagram preview">
      <div id="viewport" aria-label="Diagram canvas. Drag to pan; use buttons to zoom."><img id="diagram" alt="Rendered D2 diagram" hidden draggable="false"></div>
      <pre id="ascii" aria-label="ASCII diagram" hidden></pre>
      <div id="empty">Your diagram will appear here.</div>
    </section>
    <details id="source-panel" hidden><summary>D2 source</summary><textarea id="source" aria-label="D2 source (read only)" readonly spellcheck="false"></textarea></details>
  </main>
  <p id="status" role="status" aria-live="polite">Waiting for the host.</p>
  <script>/* BUNDLE */</script>
</body>
</html>
