name: Cloudflare
on:
  pull_request:
    branches: [main, codex/d2-stateless-refresh]
permissions:
  contents: read
jobs:
  local-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      WRANGLER_SEND_METRICS: 'false'
      XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Check deployable bundle without an account or upload
        run: |
          mkdir -p "$XDG_CONFIG_HOME/.wrangler"
          npx wrangler deploy --dry-run --outdir build/deploy
