name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate agent packages and real MCP connections
        run: |
          go build -o d2-mcp .
          D2_MCP_TEST_BINARY="$PWD/d2-mcp" python3 -m unittest discover -s agents -v
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          export GOOS="${TARGET%/*}"
          export GOARCH="${TARGET#*/}"
          go build -trimpath -o "${RUNNER_TEMP}/d2-mcp" .
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker build -t d2-mcp:test .
      - name: Exercise MCP through the non-root container
        env:
          D2_MCP_TEST_IMAGE: d2-mcp:test
        run: go test -count=1 -run '^TestContainerStdio$' .
