name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    needs: cross-build
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        if: runner.os != 'Linux'
        with:
          go-version-file: go.mod
      - name: Check standalone installer and platform handling
        run: uv run --no-project -m unittest discover -s scripts -v
      - name: Exercise native rendering, transports, and rooted files
        if: runner.os != 'Linux'
        run: go test -count=1 ./...
      - name: Select native release artifact
        id: platform
        shell: bash
        run: |
          uv run --no-project python -c 'import sys; sys.path.insert(0, "scripts"); import install; print("asset=" + install.asset_for_platform()); print("target=" + install.asset_for_platform().removeprefix("d2-mcp-").removesuffix(".exe"))' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ steps.platform.outputs.target }}
          path: release
      - name: Install exact artifact outside checkout and exercise MCP
        run: uv run scripts/check_artifact.py --binary release/${{ steps.platform.outputs.asset }} --version 0.0.0-ci
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          enable-cache: false
          python-version: '3.11'
      - name: Validate agent packages and real MCP connections
        run: |
          go build -o d2-mcp .
          D2_MCP_TEST_BINARY="$PWD/d2-mcp" uv run --no-project -m unittest discover -s agents -v
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          export GOOS="${TARGET%/*}"
          export GOARCH="${TARGET#*/}"
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          mkdir -p release
          go build -trimpath -ldflags '-X main.version=0.0.0-ci' -o "release/d2-mcp-$GOOS-$GOARCH$suffix" .
          echo "target=$GOOS-$GOARCH" >> "$GITHUB_OUTPUT"
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ steps.build.outputs.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 1
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker build -t d2-mcp:test .
      - name: Exercise MCP through the non-root container
        env:
          D2_MCP_TEST_IMAGE: d2-mcp:test
        run: go test -count=1 -run '^TestContainerStdio$' .
