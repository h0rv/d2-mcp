name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          export GOOS="${TARGET%/*}"
          export GOARCH="${TARGET#*/}"
          go build -trimpath -o "${RUNNER_TEMP}/d2-mcp" .
